<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="assets/logo.ico">
    <style>
        @font-face {
            font-family: 'Outfit';
            src: url('fonts/outfit-300.ttf') format('truetype');
            font-weight: 300;
            font-style: normal;
        }
        @font-face {
            font-family: 'Outfit';
            src: url('fonts/outfit-400.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
        }
        @font-face {
            font-family: 'Outfit';
            src: url('fonts/outfit-600.ttf') format('truetype');
            font-weight: 600;
            font-style: normal;
        }
        @font-face {
            font-family: 'Outfit';
            src: url('fonts/outfit-700.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
        }

        :root {
            --primary: #00f2ff;
            --secondary: #0072ff;
            --bg-dark: #0a0a0c;
        }

        /* Themes matching style.css */
        body.theme-falabella { --primary: #B9D40D; --secondary: #8da10a; }
        body.theme-paris { --primary: #009DE0; --secondary: #007bb0; }
        body.theme-ripley { --primary: #9932cc; --secondary: #7928a1; }
        body.theme-default { --primary: #00f2ff; --secondary: #0072ff; }

        body {
            margin: 0;
            padding: 8px; /* Reduced padding */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: transparent;
            font-family: 'Outfit', sans-serif;
            user-select: none;
            box-sizing: border-box;
            -webkit-app-region: drag; /* Make whole body draggable */
        }
        .return-btn {
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-app-region: no-drag; /* Button is specifically NOT draggable */
            white-space: nowrap;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            position: relative;
            z-index: 100;
            will-change: transform, filter;
        .return-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }
        .btn-icon {
            opacity: 0.9;
        }
        .btn-text {
            line-height: 1.2;
        }
    </style>
</head>
<body class="theme-default">
    <button class="return-btn" onclick="window.electronAPI.restoreApp()">
        <span class="btn-text">Volver a características</span>
        <div class="btn-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
                <line x1="8" y1="21" x2="16" y2="21"/>
                <line x1="12" y1="17" x2="12" y2="21"/>
                <circle cx="12" cy="10" r="3"/>
                <path d="M12 7v1"/>
                <path d="M12 12v1"/>
                <path d="M9.5 8.5 10 9"/>
                <path d="M14.5 11.5 14 11"/>
                <path d="M14.5 8.5 14 9"/>
                <path d="M9.5 11.5 10 11"/>
            </svg>
        </div>
    </button>

    <script>
        // Apply theme from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const store = urlParams.get('store') || 'none';
        
        document.body.classList.remove('theme-falabella', 'theme-paris', 'theme-ripley', 'theme-default');
        if (store === 'none') {
            document.body.classList.add('theme-default');
        } else {
            document.body.classList.add(`theme-${store}`);
        }
    </script>
</body>
</html>
